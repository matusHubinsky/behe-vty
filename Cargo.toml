[package]
name = "behe-vty"
version = "0.1.1"
authors = ["Matus Hubinsky"]
edition = '2024'
description = "Terminal wrapper that provides the autocomplete into the Cisco terminal."
readme = "README.md"
repository = "https://github.com/matusHubinsky/behe-vty"
license = "EUPL-1.2"
keywords = ["networking", "termina", "console", "auto-complete"]
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cursive = { version = "0.21", features = ["toml"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
dirs = "7"
serialport = { version = "4.10.1", default-features = false } 
tokio = { version = "1", features = ["full"] }
russh = "0.65"