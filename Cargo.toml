[package]
name = "behe-vty"
version = "1.1.2"
authors = ["Matus Hubinsky"]
edition = '2024'
description = "Cisco VTY auto-suggestion terminal client"
readme = "README.md"
repository = "https://github.com/matusHubinsky/behe-vty"
license = "EUPL-1.2-only"
keywords = ["networking", "termina", "console", "auto-complete"]
publish = false
build = "src/build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cursive = { version = "0.21", features = ["toml"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
dirs = "7"
serialport = { version = "4.10.1", default-features = false } 
tokio = { version = "1", features = ["full"] }
russh = "0.65"
rand = "0.10.3"
argon2 = "0.6"
aes-gcm = "0.11"

[package.metadata.winres]
OriginalFilename = "behe-vty.exe"
ProductName = "behe-vty"
FileDescription = "Cisco VTY auto-suggestion terminal client"
CompanyName = "Matus Hubinsky"
LegalCopyright = "EUPL-1.2-only (c) Matus Hubinsky"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"