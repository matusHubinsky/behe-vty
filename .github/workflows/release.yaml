name: Release

on:
  push:
    tags: [ "v*" ]

# Required: without this the default GITHUB_TOKEN is read-only and
# action-gh-release fails with "Resource not accessible by integration"
# when it tries to create/update the release for the tag.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: /home/runner/.cargo
  CARGO_INCREMENTAL: 0

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: behe-vty-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: behe-vty-linux-x86_64-musl.tar.gz
            packages: musl-tools
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: behe-vty-windows-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install linker toolchain (musl)
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Build release
        run: cargo build --release --verbose --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/behe-vty.exe" dist/
            tar -czf "dist/${{ matrix.artifact }}" -C dist behe-vty.exe
          else
            cp "target/${{ matrix.target }}/release/behe-vty" dist/
            tar -czf "dist/${{ matrix.artifact }}" -C dist behe-vty
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          overwrite_files: true